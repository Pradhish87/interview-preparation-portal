<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mock Test - InterviewPrep</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-mortarboard-fill me-2"></i>
            InterviewPrep
        </a>

        <a href="dashboard.html" class="btn btn-outline-light">
            Dashboard
        </a>

    </div>

</nav>


<main class="quiz-section">

    <div class="container">

        <!-- Quiz Header -->

        <div class="quiz-top mb-4">

            <div>
                <span class="section-label">MOCK TEST</span>

                <h2 class="fw-bold mt-2 mb-1">
                    Interview Preparation Test
                </h2>

                <span id="questionNumber">
                    Question 1 of 10
                </span>
            </div>

            <div class="timer-box">
                <i class="bi bi-stopwatch me-2"></i>
                <span id="timer">10:00</span>
            </div>

        </div>


        <!-- Progress -->

        <div class="progress mb-4">

            <div
                id="quizProgress"
                class="progress-bar"
                style="width: 10%;"
            ></div>

        </div>


        <!-- Question Card -->

        <div class="quiz-card">

            <h4 id="questionText" class="fw-bold mb-4">
                Loading question...
            </h4>


            <div id="optionsContainer">

                <!-- Options inserted by JavaScript -->

            </div>


            <div class="quiz-actions mt-4">

                <button
                    id="previousBtn"
                    class="btn btn-outline-secondary"
                    onclick="previousQuestion()"
                >
                    <i class="bi bi-arrow-left me-1"></i>
                    Previous
                </button>


                <button
                    id="nextBtn"
                    class="btn btn-primary"
                    onclick="nextQuestion()"
                >
                    Next
                    <i class="bi bi-arrow-right ms-1"></i>
                </button>


                <button
                    id="submitBtn"
                    class="btn btn-success d-none"
                    onclick="submitQuiz()"
                >
                    Submit Test
                    <i class="bi bi-check-circle ms-1"></i>
                </button>

            </div>

        </div>


        <!-- Instructions -->

        <div class="quiz-info mt-4">

            <div>
                <i class="bi bi-info-circle me-2"></i>

                Select one answer for each question.
                Your score will be calculated automatically.
            </div>

        </div>

    </div>

</main>


<footer class="footer bg-dark text-white">

    <div class="container py-4 text-center">

        <h5 class="fw-bold">
            <i class="bi bi-mortarboard-fill me-2"></i>
            InterviewPrep
        </h5>

        <p class="text-secondary mb-0">
            Prepare. Practice. Perform.
        </p>

    </div>

</footer>


<script type="module" src="js/quiz.js"></script>
</body>

</html>
